version: 2
updates:
  # Policy: docs/standards/dependencies.md
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR a month for everything that should not break anything.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Types track the runtime in .nvmrc; bump them with the Node upgrade.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  # Base images and the pinned Postgres/Caddy tags.
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      # Node tracks .nvmrc; bump it deliberately with the runtime upgrade.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker-compose"
    directory: "/infra"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose-images:
        patterns:
          - "*"
    ignore:
      # A Postgres major needs a dump/restore upgrade, never an automatic bump.
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
